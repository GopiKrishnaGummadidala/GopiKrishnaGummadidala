<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="Skill areas">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { fill: #0369a1; font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
  .label { fill: #1f2328; font: 500 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
  .muted { fill: #57606a; font: 500 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
  .grid { fill: none; stroke: #d0d7de; }
  .track { fill: #eaeef2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title { fill: #38bdf8; }
    .label { fill: #e6edf3; }
    .muted { fill: #8b949e; }
    .grid { stroke: #30363d; }
    .track { fill: #21262d; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .shape { transform-origin: 240px 200px; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
<defs>
  <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
